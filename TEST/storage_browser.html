<!doctype html>
<html><head><meta charset="utf-8"><title>RUNNING</title></head>
<body>
<div id="out">RUNNING</div>
<script src="/js/storage.js"></script>
<script>
(async () => {
  const out = document.getElementById('out');
  function log(s){ out.textContent += '\n' + s; document.title = 'UPDATED'; }
  try {
    // 模拟「项目系统加入前」的老数据（key 无前缀、无 lib/无 id）
    const dbReq = indexedDB.open('story-editor', 1);
    await new Promise((res,rej)=>{
      dbReq.onupgradeneeded=()=>{const db=dbReq.result;
        if(!db.objectStoreNames.contains('assets')) db.createObjectStore('assets',{keyPath:'key'});
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});};
      dbReq.onsuccess=()=>res(); dbReq.onerror=()=>rej(dbReq.error);
    });
    const db = dbReq.result;
    await new Promise((res,rej)=>{ const tx=db.transaction('assets','readwrite');
      tx.objectStore('assets').put({key:'background:bg1', name:'天空', kind:'image', src:'data:image/png;base64,iVBOR'});
      tx.objectStore('assets').put({key:'music:m1', name:'BGM', src:'data:audio/mp3;base64,xxx'});
      tx.objectStore('assets').put({key:'item:it1', name:'宝箱', glb:'data:model/gltf', exitMesh:null});
      tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); });
    log('seed done');
    await Storage.migrateLegacyIfNeeded();
    const pid = Storage.getCurrentProjectId();
    Storage.setCurrentProject(pid);
    const bg = await Storage.getAllAssets('background');
    const mu = await Storage.getAllAssets('music');
    const it = await Storage.getAllAssets('item');
    log('project=' + pid);
    log('background count=' + bg.length + ' first=' + JSON.stringify(bg[0]));
    log('music count=' + mu.length);
    log('item count=' + it.length);
    log('DONE');
  } catch(e){ log('ERROR: ' + (e && e.stack || e)); }
})();
</script>
</body></html>
