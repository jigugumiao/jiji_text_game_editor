<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DOF/HDRI 诊断</title>
<style>html,body{margin:0;height:100%;background:#0a0c12}#viewer{width:600px;height:600px;position:relative;background:transparent}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="viewer"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

try {
const FOV = 50, DOF = window.__DOF__, HDRI = window.__HDRI__;
const scene = new THREE.Scene();
scene.background = null;
const container = document.getElementById('viewer');
const camera = new THREE.PerspectiveCamera(FOV, container.clientWidth/container.clientHeight, 0.01, 5000);
camera.position.set(3,2,5);

const PIXEL_SIZE = 2;
const renderer = new THREE.WebGLRenderer({ antialias:false, alpha:true });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);
renderer.domElement.style.width = '100%'; renderer.domElement.style.height='100%';
renderer.domElement.style.imageRendering = 'pixelated';

function resizeView(){ const w=container.clientWidth,h=container.clientHeight; if(!w||!h)return; renderer.setSize(Math.max(1,Math.floor(w/PIXEL_SIZE)),Math.max(1,Math.floor(h/PIXEL_SIZE)),false); }
resizeView();

// ===== 环境 / IBL（与 exporter.js 当前逻辑一致）=====
if (HDRI) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();
}
// ===== 灯光布光（与 exporter.js v25.4.36 一致：HDRI 条件分支）=====
if (HDRI) {
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9); keyLight.position.set(5,8,6); scene.add(keyLight);
} else {
  const keyLight = new THREE.DirectionalLight(0xffffff, 1.4); keyLight.position.set(5,8,6); scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5); fillLight.position.set(-6,3,-4); scene.add(fillLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.5));
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance=0.1; controls.maxDistance=1000;

let _composer=null, _bokeh=null, _dofFocusObj=null, _modelCenter = new THREE.Vector3();
const _dofTmp = new THREE.Vector3();
function ensureComposer(){
  if(_composer) return;
  _composer = new EffectComposer(renderer);
  _composer.addPass(new RenderPass(scene, camera));
  _bokeh = new BokehPass(scene, camera, { focus:10.0, aperture:(DOF&&DOF.aperture)||0.025, maxblur:(DOF&&DOF.maxblur)||0.01, width:renderer.domElement.width||container.clientWidth, height:renderer.domElement.height||container.clientHeight });
  _composer.addPass(_bokeh);
  if(_bokeh.materialBokeh && _bokeh.materialBokeh.fragmentShader){
    _bokeh.materialBokeh.fragmentShader = _bokeh.materialBokeh.fragmentShader.split('gl_FragColor.a = 1.0;').join('');
    _bokeh.materialBokeh.needsUpdate = true;
  }
  if(_bokeh.materialBokeh) _bokeh.materialBokeh.blending = THREE.NoBlending;
}
function updateDofFocus(){
  const tgt = (_dofFocusObj && _dofFocusObj.getWorldPosition) ? _dofFocusObj.getWorldPosition(_dofTmp) : _modelCenter;
  if(_bokeh && _bokeh.uniforms) _bokeh.uniforms['focus'].value = camera.position.distanceTo(tgt);
}

// 主体：明显反射的金属盒
const currentModel = new THREE.Group();
const box = new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2), new THREE.MeshStandardMaterial({ color:0xffffff, metalness:0.9, roughness:0.18 }));
currentModel.add(box);
scene.add(currentModel);
if (DOF && DOF.enabled && DOF.focusObject) { _dofFocusObj = currentModel.getObjectByName(DOF.focusObject) || null; }
// 重新居中到原点
const box3 = new THREE.Box3().setFromObject(currentModel);
const size = box3.getSize(new THREE.Vector3());
const center = box3.getCenter(new THREE.Vector3());
currentModel.position.sub(center);

// 背景棋盘格平面（用于观察景深虚化：清晰=能看见格子，虚化=糊成一片）
const bgTex = (function(){
  const c = document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){ g.fillStyle=((x+y)%2)?'#ffcc33':'#3366ff'; g.fillRect(x*32,y*32,32,32); }
  const t = new THREE.CanvasTexture(c); return t;
})();
const bgPlane = new THREE.Mesh(new THREE.PlaneGeometry(20,20), new THREE.MeshBasicMaterial({ map:bgTex }));
bgPlane.position.set(0,0,-4); scene.add(bgPlane);

const fov = camera.fov*(Math.PI/180);
let dist = Math.abs(1.2/2/Math.tan(fov/2)); dist*=3.2;
camera.position.set(1.2*0.7, 1.2*0.5, dist);
camera.lookAt(0,0,0); controls.target.set(0,0,0);
controls.minDistance = 1.2*0.05; controls.maxDistance = 1.2*20; controls.update();
_modelCenter.set(0,0,0);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  if (DOF && DOF.enabled) { ensureComposer(); if(_bokeh&&_bokeh.uniforms){_bokeh.uniforms['aperture'].value=(DOF&&DOF.aperture)||0.025;_bokeh.uniforms['maxblur'].value=(DOF&&DOF.maxblur)||0.01;} updateDofFocus(); _composer.render(); }
  else { renderer.render(scene, camera); }
}
animate();
window.__ready = true;
window.__diag = { camDist: camera.position.length(), focus: (DOF&&DOF.enabled)?camera.position.length():null };
} catch (e) {
  window.__err = String(e && e.stack || e);
}
</script>
</body>
</html>
